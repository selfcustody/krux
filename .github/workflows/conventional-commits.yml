name: Conventional Commits

on:
  pull_request: # We only need to check commit messages in PRs

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          allowed-commit-types: "feat,fix,docs,style,refactor,perf,test,i18n,ci,chore,git"
