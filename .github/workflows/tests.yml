name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint-black:
    strategy:
      matrix:
        # minimum tested python version
        # maximum python version
        py-version: [ "3.11.17", "3.12.15"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.13.6"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.py-version }}
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.py-version }}
      - name: Check formatting
        run: uv run --python ${{ matrix.py-version }} black --check --verbose firmware/font firmware/scripts i18n src tests

  lint-pylint:
    strategy:
      matrix:
        # minimum tested python version
        # maximum python version
        py-version: [ "3.11.17", "3.12.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.13.6"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.py-version }}
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.py-version }}
      - name: Lint
        run: uv run --python ${{ matrix.py-version }} poe lint

  check-translations:
    strategy:
      matrix:
        # minimum tested python version
        # maximum python version
        py-version: [ "3.11.17", "3.12.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.13.6"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.py-version }}
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.py-version }}
      - name: Validate translations
        run: uv run --python ${{ matrix.py-version }} poe i18n validate

  run-tests:
    strategy:
      matrix:
        # minimum tested python version
        # maximum python version
        py-version: [ "3.11.17", "3.12.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.13.6"
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.py-version }}
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.py-version }}
      - name: Build libsecp256k1
        run: uv run --python ${{ matrix.py-version }} poe secp256k1-build
      - name: Check embit uses the C secp256k1
        run: uv run --python ${{ matrix.py-version }} poe secp256k1-check
      - name: Run tests
        run: uv run --python ${{ matrix.py-version }} poe test-simple

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.13.6"
          enable-cache: true
      - name: Set up Python
        # no need to use many coverages
        run: uv python install 3.12.15
      - name: Sync dependencies
        run: uv sync --frozen --python 3.12.15
      - name: Build libsecp256k1
        run: uv run --python 3.12.15 poe secp256k1-build
      - name: Check embit uses the C secp256k1
        run: uv run --python 3.12.15 poe secp256k1-check
      - name: Build coverage file
        run: uv run --python 3.12.15 pytest --cache-clear --cov src/krux --cov-report xml tests
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}